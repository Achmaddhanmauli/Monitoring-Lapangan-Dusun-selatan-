<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPARS - Branch Performance Activity Reporting System (v1.1)</title>
  <style>
    :root {
      --primary: #4a154b;
      --accent: #7c3aed;
      --bg-light: #f8fafc;
      --text-main: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 {
      font-size: 18px;
      color: var(--primary);
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    select, input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .status-box {
      font-size: 12px;
      color: #64748b;
      margin-top: 6px;
      padding: 6px 8px;
      background: #f1f5f9;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>BPARS DUSUN SELATAN (v1.1)</h2>
  
  <form id="reportForm" onsubmit="submitForm(event)">
    
    <div class="form-group">
      <label>Nama Petugas</label>
      <select id="namaPetugas" required>
        <option value="">-- Pilih Petugas --</option>
        <option value="Abdul Hamit">Abdul Hamit</option>
        <option value="Frengky">Frengky</option>
        <option value="Fatimah">Fatimah</option>
        <option value="Hikmah Aulia">Hikmah Aulia</option>
        <option value="Ahmad Irpansah">Ahmad Irpansah</option>
      </select>
    </div>

    <div class="form-group">
      <label>Jenis Kegiatan</label>
      <select id="jenisKegiatan" required>
        <option value="">-- Pilih Kegiatan --</option>
        <option value="Uji Kelayakan">Uji Kelayakan</option>
        <option value="Akad Pencairan">Akad Pencairan</option>
        <option value="Hasil Penagihan PAR">Hasil Penagihan PAR</option>
        <option value="Home Visit">Home Visit</option>
        <option value="Sosialisasi">Sosialisasi</option>
      </select>
    </div>

    <div class="form-group">
      <label>Kategori Mitra</label>
      <select id="kategoriMitra">
        <option value="-">- Pilih Kategori -</option>
        <option value="NTB">NTB (New to Bank)</option>
        <option value="ETB">ETB (Existing to Bank)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Jumlah Plafond / Nominal (Rp)</label>
      <input type="number" id="plafond" placeholder="Contoh: 5000000" min="0" value="0">
    </div>

    <div class="form-group">
      <label>Keterangan / Catatan Lapangan</label>
      <textarea id="keterangan" rows="3" placeholder="Jelaskan detail kegiatan..."></textarea>
    </div>

    <div class="form-group">
      <label>Foto Kegiatan (Kamera Live)</label>
      <input type="file" id="fotoFile" accept="image/*" capture="environment" onchange="handlePhotoCapture(this)" required>
      <div id="fileStatus" class="status-box">Belum ada foto dipilih. GPS terkunci otomatis saat foto diambil.</div>
    </div>

    <div class="form-group">
      <label>Koordinat GPS Presisi</label>
      <input type="text" id="gps" placeholder="Latitude, Longitude" readonly required>
      <!-- Kolom tersembunyi untuk mencatat tingkat akurasi meter -->
      <input type="hidden" id="gpsAccuracy" value="0">
    </div>

    <button type="submit" id="btnSubmit">Kirim Laporan v1.1</button>
  </form>
</div>

<script>
  // [Fase v1.1] Tangkap GPS otomatis saat foto dipilih
  function handlePhotoCapture(input) {
    const statusEl = document.getElementById('fileStatus');
    const gpsInput = document.getElementById('gps');
    const gpsAccuracyInput = document.getElementById('gpsAccuracy');

    if (input.files && input.files[0]) {
      statusEl.innerText = "⏳ Memproses foto & mengunci titik GPS presisi...";
      
      if (!navigator.geolocation) {
        alert("Geolocation tidak didukung di perangkat HP ini.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude.toFixed(7);
          const lng = pos.coords.longitude.toFixed(7);
          const akurasiMeter = Math.round(pos.coords.accuracy);

          gpsInput.value = `${lat}, ${lng}`;
          gpsAccuracyInput.value = akurasiMeter;

          statusEl.innerText = `✓ Foto siap! GPS Terkunci (Akurasi: ±${akurasiMeter} meter)`;
          
          if (akurasiMeter > 50) {
            statusEl.innerText += " ⚠️ (Akurasi rendah, usahakan di luar ruangan)";
          }
        },
        err => {
          let pesan = "Gagal mendapatkan koordinat GPS.";
          if (err.code === 1) pesan = "Izin lokasi ditolak pengguna.";
          else if (err.code === 2) pesan = "Sinyal GPS hilang / tidak tersedia.";
          else if (err.code === 3) pesan = "Waktu pencarian GPS habis (Timeout).";
          
          alert(pesan);
          statusEl.innerText = "❌ " + pesan;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
  }

  // [Fase v1.1] Kirim Data Aman ke Backend Apps Script
  async function submitForm(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerText = "Sedang Mengirim...";

    const fileInput = document.getElementById('fotoFile');
    let fotoBase64Data = "";

    if (fileInput.files && fileInput.files[0]) {
      try {
        fotoBase64Data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = error => reject(error);
          reader.readAsDataURL(fileInput.files[0]);
        });
      } catch (err) {
        console.error("Gagal membaca file foto:", err);
      }
    }

    const payload = {
      namaPetugas: document.getElementById('namaPetugas').value,
      jenisKegiatan: document.getElementById('jenisKegiatan').value,
      kategoriMitra: document.getElementById('kategoriMitra').value,
      plafond: document.getElementById('plafond').value || 0,
      keterangan: document.getElementById('keterangan').value,
      fotoUrl: fotoBase64Data,
      gps: document.getElementById('gps').value,
      gpsAccuracy: document.getElementById('gpsAccuracy').value,
      waktuKegiatan: new Date().toISOString()
    };

    // URL Web App Apps Script Anda yang baru saja di-deploy
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDfrzKWdq4TaL_0ndekApN6DnjQXVgZEH6PmxnYnlx--JHUkfe43rmHiKV6LiU.../exec";

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      alert("Laporan berhasil dikirim ke server v1.1!");
      document.getElementById('reportForm').reset();
      document.getElementById('fileStatus').innerText = "Belum ada foto dipilih. GPS terkunci otomatis saat foto diambil.";
    } catch (error) {
      alert("Terjadi kesalahan jaringan: " + error);
    } finally {
      btn.disabled = false;
      btn.innerText = "Kirim Laporan v1.1";
    }
  }
</script>

</body>
</html>
